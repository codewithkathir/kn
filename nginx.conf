server {
listen 80;

root /usr/share/nginx/html;
index index.html;

location = /index {
    return 301 /;
}

location = /index.html {
    return 301 /;
}

rewrite ^/([^/.]+)\.html$ /$1 permanent;

location / {
    try_files $uri $uri.html $uri/ =404;
}

location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

}
# =================================================================
# Nginx snippet for kathiravan.dev
# -----------------------------------------------------------------
# Goal: serve clean, extension-less URLs like /about, /projects, etc.
# and 301-redirect any legacy /about.html (and /index, /index.html)
# requests so SEO + existing backlinks are preserved.
#
# How to use on the VPS:
#   1. Drop these directives inside your existing `server { ... }`
#      block (the one that serves kathiravan.dev), OR
#      `include` this file from your main vhost config.
#   2. `nginx -t` to validate, then `systemctl reload nginx`.
# =================================================================

# 1) Redirect /index, /index.html, /index.html?... -> /
location = /index      { return 301 /; }
location = /index.html { return 301 /; }

# 2) Redirect /<page>.html -> /<page>  (strip the extension)
#    Uses a one-shot rewrite so query strings are preserved.
if ($request_uri ~ ^/([^/?]+)\.html(\?.*)?$) {
    return 301 /$1$2;
}

# 3) Resolve clean URLs to the underlying .html file on disk.
#    Tries in order: exact file, file.html, directory index, 404.
location / {
    try_files $uri $uri.html $uri/ =404;
}

# 4) (Optional but recommended) cache-bust the html-less URLs lightly
#    while letting versioned static assets cache hard.
location ~* \.(?:css|js|png|jpe?g|svg|webp|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}
